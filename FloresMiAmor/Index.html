<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti 🌻</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scene">

        <div class="stars"></div>

        <section class="intro">
            <p class="small-text">Tengo algo para ti...</p>

            <h1>🌻</h1>

            <h2>Un pequeño detalle</h2>

            <button id="openButton">
                Abrir 💛
            </button>
        </section>

<section class="garden" id="garden">

    <!-- Cielo -->

    <div class="moon">
        <div class="moon-shadow"></div>
    </div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="stars"></div>

    <!-- Efectos -->

    <div class="fireflies" id="fireflies"></div>
    <div class="petals" id="petals"></div>

    <!-- Mensaje -->

    <div class="message">

        <h2>Para ti 🌻</h2>

        <p>
            Hay flores que simplemente son bonitas,
            pero algunas tienen una forma especial
            de recordarnos a alguien.
        </p>

        <p>
            Por eso hoy quería regalarte
            un pequeño pedacito de primavera.
        </p>

        <span>💛</span>

    </div>

    <!-- Campo -->

    <div class="field" id="field"></div>

</section>

    </main>

    <script src="script.js"></script>

</body>
</html>
